<!doctype html>
<!-- TinkerTill: page not found. GitHub Pages shows this for any address that doesn't exist. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Page not found - TinkerTill</title>
  <style>
    @font-face { font-family: Montserrat; font-weight: 500; font-display: swap; src: url(/fonts/montserrat-500.woff2) format("woff2"); }
    @font-face { font-family: Montserrat; font-weight: 700; font-display: swap; src: url(/fonts/montserrat-700.woff2) format("woff2"); }
    @font-face { font-family: Montserrat; font-weight: 800; font-display: swap; src: url(/fonts/montserrat-800.woff2) format("woff2"); }

    /* TinkerTill brand tokens (src/theme/tokens.ts). Dark is the default; light follows the device. */
    :root {
      --navy: #0F1B2D; --navy-edge: #2A3B57; --blue: #4C7DFF; --gold: #FFC83D; --gold-light: #FFD95E; --gold-deep: #E5A100;
      --mist: #B8C2DA; --white: #FFFFFF;
      --bg: #0F1B2D; --surface: #16243A; --edge: #2A3B57; --text: #FFFFFF; --muted: #B8C2DA;
      --link: #FFD95E; --focus: #FFD95E; --btn-bg: #3461D9; --money: #FFC83D; --money-bg: transparent;
      --good: #27AE60; --hero-bg: #0F1B2D; --soft: #1B2C48;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #FFFFFF; --surface: #F2F5FB; --edge: #CBD4E6; --text: #0F1B2D; --muted: #4A5875;
        --link: #3461D9; --focus: #3461D9; --btn-bg: #3461D9; --money: #0F1B2D; --money-bg: #FFE08A;
        --good: #1B7A43; --soft: #E8EEF9;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: Montserrat, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500; font-size: 17px; line-height: 1.6;
    }
    img { max-width: 100%; height: auto; display: block; }
    a { color: var(--link); text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
    .skip { position: absolute; left: -999px; top: 8px; background: var(--white); color: var(--navy); padding: 10px 14px; border-radius: 10px; font-weight: 700; z-index: 10; }
    .skip:focus { left: 8px; }

    /* Brand band: always navy, so "Till" is always the bright gold. */
    .band { background: var(--navy); color: var(--white); border-bottom: 1px solid var(--navy-edge); }
    .band .wrap { display: flex; align-items: center; gap: 12px; padding-top: 14px; padding-bottom: 14px; }
    .brand { display: flex; align-items: center; gap: 12px; color: var(--white); text-decoration: none; margin-right: auto; }
    .brand svg { flex: none; }
    .word { font-weight: 800; font-size: 24px; line-height: 1.1; }
    .word span { color: var(--gold); }
    .tag { color: var(--mist); font-size: 14px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 12px 22px;
      border-radius: 14px; font-weight: 800; font-size: 19px; text-decoration: none; border: 2px solid transparent;
    }
    .btn.primary { background: var(--btn-bg); color: var(--white); }
    .btn.primary:hover { background: #2B53C2; }
    .btn.ghost { color: var(--white); border-color: var(--mist); }
    .btn.ghost:hover { border-color: var(--white); }
    .band .btn { min-height: 44px; padding: 8px 16px; font-size: 19px; }
    .btn:focus-visible { outline: 3px solid var(--gold-light); outline-offset: 3px; }

    /* Hero: navy in both themes, like the app's brand band. */
    .hero { background: radial-gradient(ellipse at 75% 40%, #1B2C48 0%, #0F1B2D 65%); color: var(--white); overflow: hidden; position: relative; }
    .hero .wrap { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 40px; align-items: center; padding-top: 56px; padding-bottom: 64px; position: relative; }
    .hero h1 { font-weight: 800; font-size: clamp(34px, 5vw, 54px); line-height: 1.1; letter-spacing: -0.5px; margin: 0 0 16px; }
    .hero h1 em { font-style: normal; color: var(--gold); }
    .hero .lead { font-size: 19px; color: var(--mist); margin: 0 0 26px; max-width: 34em; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .hero .note { color: var(--mist); font-size: 15px; margin: 16px 0 0; }
    .layers { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 7px; opacity: .5; pointer-events: none; }
    .layers i { display: block; height: 9px; border-radius: 5px; background: var(--navy-edge); }
    .phones { position: relative; display: flex; justify-content: center; min-height: 420px; }
    .phone { width: 270px; border: 3px solid var(--navy-edge); border-radius: 32px; overflow: hidden; background: var(--navy); box-shadow: 0 18px 50px rgba(0,0,0,.5); }
    .phones .phone.back { position: absolute; width: 230px; right: calc(50% + 40px); top: 40px; opacity: .9; transform: rotate(-6deg); }
    .phones .phone.front { position: relative; transform: rotate(3deg); margin-left: 120px; }

    section { padding: 64px 0; }
    section.alt { background: var(--surface); border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); }
    h2 { font-weight: 800; font-size: clamp(28px, 3.6vw, 38px); line-height: 1.2; margin: 0 0 12px; letter-spacing: -0.3px; }
    h3 { font-weight: 800; font-size: 21px; margin: 0 0 6px; }
    .intro { color: var(--muted); font-size: 19px; max-width: 40em; margin: 0 0 32px; }
    .kicker { display: inline-block; font-weight: 800; font-size: 15px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }

    /* Price it / Sell it / Keep it */
    .step { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; padding: 28px 0; }
    .step + .step { border-top: 1px solid var(--edge); }
    .step .shot { display: flex; justify-content: center; }
    .step:nth-of-type(even) .shot { order: -1; }
    .step .phone { width: 280px; }
    .step h2 em { font-style: normal; color: var(--link); }
    ul.ticks { list-style: none; padding: 0; margin: 16px 0 0; }
    ul.ticks li { position: relative; padding: 6px 0 6px 36px; }
    ul.ticks li::before {
      content: "✓"; position: absolute; left: 0; top: 7px; width: 26px; height: 26px; border-radius: 50%;
      background: var(--good); color: var(--white); font-weight: 800; font-size: 15px; display: grid; place-items: center; line-height: 1;
    }
    .money { color: var(--money); background: var(--money-bg); font-weight: 800; padding: 0 4px; border-radius: 4px; font-variant-numeric: tabular-nums; }

    /* What it counts */
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .card { background: var(--bg); border: 2px solid var(--edge); border-radius: 16px; padding: 18px; }
    .card p { margin: 0; color: var(--muted); font-size: 16px; }
    .dots { display: flex; gap: 5px; margin-bottom: 12px; }
    .dots i { width: 16px; height: 16px; border-radius: 50%; display: block; border: 2px solid var(--edge); }

    /* Grown-ups */
    .parents { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 40px; }
    .parents ul.ticks { margin: 0; }

    /* Plans */
    .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: stretch; }
    .plan { background: var(--surface); border: 2px solid var(--edge); border-radius: 18px; padding: 24px; display: flex; flex-direction: column; }
    .plan h3 { font-size: 24px; }
    .plan .price { margin: 6px 0 4px; display: inline-block; align-self: flex-start; background: var(--gold-light); border: 3px solid var(--gold-deep); color: var(--navy); border-radius: 14px; padding: 6px 14px; font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
    .plan .price small { font-size: 16px; font-weight: 700; }
    .plan .sub { color: var(--muted); margin: 6px 0 0; }
    .plan ul.ticks { flex: 1; }
    .plan .fine { color: var(--muted); font-size: 15px; margin: 16px 0 0; }

    .cta { background: var(--navy); color: var(--white); text-align: center; }
    .cta h2 { color: var(--white); }
    .cta p { color: var(--mist); margin: 0 0 24px; font-size: 19px; }

    footer { padding: 32px 0 48px; border-top: 1px solid var(--edge); }
    footer nav { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 14px; }
    footer nav a { font-weight: 700; display: inline-block; padding: 10px 0; }
    footer p { color: var(--muted); margin: 4px 0; font-size: 15px; }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 760px) {
      .band .tag { display: none; }
      .hero .wrap { grid-template-columns: 1fr; padding-top: 36px; padding-bottom: 56px; gap: 28px; }
      .phones { min-height: 0; }
      .phones .phone.back { display: none; }
      .phones .phone.front { margin-left: 0; transform: none; width: 250px; }
      .step, .parents, .plans { grid-template-columns: 1fr; gap: 24px; }
      .step:nth-of-type(even) .shot { order: 0; }
      .step .phone { width: 240px; }
      section { padding: 48px 0; }
    }
    @media (max-width: 420px) {
      .grid { gap: 10px; }
      .card { padding: 14px; }
      .card h3 { font-size: 17px; }
      .card p { font-size: 15px; }
      .band .btn { padding: 8px 12px; }
      .word { font-size: 21px; }
      .actions .btn { width: 100%; }
    }
    @media (max-width: 340px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
